const DAYS = ["Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado", "Domingo"];
const ALIASES = { macarr: "pasta", espagu: "pasta", tallar: "pasta", fideo: "pasta", penne: "pasta", pechuga: "pollo", filete: "ternera", platano: "platano", banana: "platano", huevos: "huevo", claras: "clara", tostada: "pan", bocadillo: "pan" };
const fold = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
function foodMatches(name, query) {

  return !q || n.includes(q) || Object.entries(ALIASES).some(([k, t]) => q.startsWith(k) && n.includes(t));

const MEALS = [["breakfast", "Desayuno"], ["lunch", "Almuerzo"], ["snack", "Merienda"], ["dinner", "Cena"]];
const SHARE = { breakfast: 0.25, lunch: 0.35, snack: 0.15, dinner: 0.25 };

/* ===== Estado y guardado ===== */
const LOCAL_KEY = "now-or-never-demo-v1";
const KEY_STORE = "now-or-never-claude-key";
function freshState() {
  return {
    v: 1, updatedAt: 0,
    profile: { weight: null, heightCm: null, age: null, sex: null, activity: "moderate", goal: "recomposition", auto: false },
    targets: { kcal: 2300, protein: 180, carbs: 250, fat: 65, steps: 8000 },
    weights: [], days: {}, routine: {}, logs: {},
  };
}
let S = freshState();
let tab = "home";
let ui = { day: dayKey(new Date()), session: null, editRoutine: false };
let db = null, docRef = null, sample = null, downloads = null, cloudStatus = "Guardado en este navegador";
let saveTimer = null, writing = false, pendingWrite = false;

function readLocal() { try { const raw = localStorage.getItem(LOCAL_KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; } }
function writeLocal() { try { localStorage.setItem(LOCAL_KEY, JSON.stringify(S)); } catch (e) { /* almacenamiento no disponible */ } }
function save() {
  S.updatedAt = Date.now();
  writeLocal();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(pushCloud, 800);
}
async function pushCloud() {
  if (!docRef) return;
  if (writing) { pendingWrite = true; return; }
  writing = true;
  try { await docRef.set(JSON.parse(JSON.stringify(S))); cloudStatus = "Guardado en tu cuenta de Claude"; }
  catch (e) { cloudStatus = e && e.code === "quota_exceeded" ? "Sin espacio en la nube: exporta una copia" : "No se pudo guardar en la nube (sí en este navegador)"; }
  writing = false;
  if (pendingWrite) { pendingWrite = false; pushCloud(); }
}
function normalize(x) { const base = freshState(); return x && typeof x === "object" ? { ...base, ...x, profile: { ...base.profile, ...(x.profile || {}) }, targets: { ...base.targets, ...(x.targets || {}) } } : base; }

/* ===== Utilidades ===== */
function pad(n) { return String(n).padStart(2, "0"); }
function dayKey(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function parseDay(k) { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d, 12); }
function weekday(d) { const w = d.getDay(); return w === 0 ? 7 : w; }
function weekStartKey(d) { const x = new Date(d); x.setDate(x.getDate() - (weekday(x) - 1)); return dayKey(x); }
function addDays(k, n) { const d = parseDay(k); d.setDate(d.getDate() + n); return dayKey(d); }
const fmt0 = v => Math.round(v).toLocaleString("es-ES", { useGrouping: false });
const fmt1 = v => (Math.round(v * 10) / 10).toLocaleString("es-ES", { maximumFractionDigits: 1 });
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]); }
function num(v) { if (v === null || v === undefined) return null; const n = parseFloat(String(v).replace(",", ".")); return isFinite(n) ? n : null; }
function niceDate(k) { return parseDay(k).toLocaleDateString("es-ES", { weekday: "long", day: "numeric", month: "long" }); }
function toast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.hidden = false; clearTimeout(t._h); t._h = setTimeout(() => (t.hidden = true), 2600); }

/* ===== Nutrición (misma lógica que la app nativa) ===== */
const V0 = () => ({ kcal: 0, protein: 0, carbs: 0, fat: 0 });
function add(a, b) { return { kcal: a.kcal + b.kcal, protein: a.protein + b.protein, carbs: a.carbs + b.carbs, fat: a.fat + b.fat }; }
function per(p100, g) { const f = Math.max(g, 0) / 100; return { kcal: p100.kcal * f, protein: p100.protein * f, carbs: p100.carbs * f, fat: p100.fat * f }; }
function foodV(key) { const f = FOODS[key]; return { kcal: f.kcal, protein: f.protein, carbs: f.carbs, fat: f.fat }; }
function scaledGrams(g, factor) {
  if (Math.abs(factor - 1) < 0.001) return g;
  const raw = g * factor, step = raw < 20 ? 1 : raw < 100 ? 5 : 10;
  return Math.max(Math.round(raw / step) * step, 1);
}
const CANDIDATES = (() => {
  const out = { breakfast: [], lunch: [], snack: [], dinner: [] }, seen = new Set();
  CATALOG.menus.forEach(m => m.meals.forEach(meal => {
    const sig = meal.type + JSON.stringify(meal.items);
    if (seen.has(sig)) return; seen.add(sig);
    out[meal.type].push({ id: "m" + m.number + "-" + meal.type, label: "Menú " + m.number + " · " + m.name, items: meal.items });
  }));
  (CATALOG.ideas || []).forEach((idea, i) => out[idea.type].push({ id: "i" + i, label: idea.name, idea: true, items: idea.items }));
  return out;
})();
function candidate(type, id) { return CANDIDATES[type].find(c => c.id === id); }
function linesOf(items, factor) {
  return items.map(it => { const g = scaledGrams(it.grams, factor); return { name: FOODS[it.food].name, basis: BASIS[FOODS[it.food].basis] || "", grams: g, v: per(foodV(it.food), g) }; });

function totalsOf(lines) { return lines.reduce((a, l) => add(a, l.v), V0()); }
function fit(v, t) {

function bestOption(c, target) {

  for (let f = 0.75; f <= 1.3501; f += 0.05) {
    const factor = Math.round(f * 100) / 100, v = totalsOf(linesOf(c.items, factor)), s = fit(v, target);

}
function rank(type, target, limit) { return CANDIDATES[type].map(c => bestOption(c, target)).sort((a, b) => b.fit - a.fit).slice(0, limit); }
function targetFor(type, fixed) {
  const T = S.targets, used = Object.entries(fixed).filter(([k]) => k !== type).reduce((a, [, v]) => add(a, v), V0());

  const pending = MEALS.map(m => m[0]).filter(k => k === type || !fixed[k]);
  const share = pending.reduce((a, k) => a + SHARE[k], 0), f = SHARE[type] / share;
  return { kcal: rem.kcal * f, protein: rem.protein * f, carbs: rem.carbs * f, fat: rem.fat * f };
}
function dayData(k) { const d = S.days[k] || (S.days[k] = { meals: {}, done: {} }); d.log = d.log || {}; return d; }
function logOfDay(k, t) { const d = S.days[k]; return (d && d.log && d.log[t]) || []; }
function logTotals(items) { return items.reduce((a, it) => add(a, per(it.per100, it.grams)), V0()); }
/** Comida de un día: lo apuntado a mano, lo elegido o (por defecto) la del menú 1. */
function resolve(k, type) {
  const d = S.days[k], m = d && d.meals[type];

    const lines = m.items.map(it => ({ name: it.name, basis: it.source === "claude" ? "estimación de Claude (IA)" : it.source === "manual" ? "manual" : "catálogo", grams: it.grams, v: per(it.per100, it.grams) }));
    return { kind: "custom", label: "Apuntado por ti", lines, totals: totalsOf(lines) };

  const c = (m && candidate(type, m.id)) || CANDIDATES[type][0], factor = m ? m.factor : 1, lines = linesOf(c.items, factor);

const ACT = { sedentary: [1.2, "Sedentario"], light: [1.375, "Ligero (1–3 días)"], moderate: [1.55, "Moderado (3–5 días)"], high: [1.725, "Alto (6–7 días)"], veryHigh: [1.9, "Muy alto"] };

// Igual que la app: proteína = 25–35 % de las kcal según objetivo, entre 1,6 y 2,4 g/kg; grasa 25 % (0,6 g/kg–35 %).
function macrosFor(kcal, w, goal) {
  const g = GOAL[goal] || GOAL.recomposition;

  if (w) { protein = Math.min(Math.max(protein, w * 1.6), w * 2.4, kcal * 0.40 / 4); fat = Math.min(Math.max(fat, w * 0.6), kcal * 0.35 / 9); }
  protein = Math.round(protein); fat = Math.round(fat);
  return { protein, fat, carbs: Math.max(Math.round((kcal - protein * 4 - fat * 9) / 4), 0) };
}

}

const VIEWS = [["front", "Frente"], ["side", "Lateral"], ["back", "Espalda"]];
let PHOTOS = {};
function photoDB() {
  return new Promise((ok, ko) => { const r = indexedDB.open("now-or-never-photos", 1); r.onupgradeneeded = () => r.result.createObjectStore("photos"); r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error); });

async function photoTx(mode, fn) { const d = await photoDB(); return new Promise((ok, ko) => { const tx = d.transaction("photos", mode), st = tx.objectStore("photos"), r = fn(st); tx.oncomplete = () => ok(r && r.result); tx.onerror = () => ko(tx.error); }); }
async function loadPhotos() {

function monthKey(d) { return d.toISOString().slice(0, 7); }

  ${months.map(m => `<section class="card"><h3>${monthName(m)}</h3><div class="photo-grid">${VIEWS.map(([v, l]) => slot(m, v, l, false)).join("")}</div></section>`).join("")}`;

function downscale(file) {
  return new Promise((ok, ko) => { const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { const k = Math.min(1, 1400 / Math.max(img.width, img.height)), c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); ok(c.toDataURL("image/jpeg", 0.85)); };
    img.onerror = () => { URL.revokeObjectURL(url); ko(new Error("imagen")); }; img.src = url; });
}
async function savePhoto(key, file) {
  try { const src = await downscale(file), v = { src, at: Date.now() }; await photoTx("readwrite", st => st.put(v, key)); PHOTOS[key] = v; render(); toast("Foto guardada"); }
  catch (e) { toast("No se pudo guardar la foto en este navegador"); }
}
function chart(ws) {
  const W = 320, H = 150, P = { l: 34, r: 8, t: 10, b: 22 }, kg = ws.map(w => w.kg);
  const lo = Math.floor(Math.min(...kg) - 0.5), hi = Math.ceil(Math.max(...kg) + 0.5);
  const t0 = parseDay(ws[0].date).getTime(), t1 = Math.max(parseDay(ws[ws.length - 1].date).getTime(), t0 + 1);
  const x = d => P.l + (parseDay(d).getTime() - t0) / (t1 - t0) * (W - P.l - P.r), y = v => P.t + (hi - v) / (hi - lo) * (H - P.t - P.b);
  const pts = ws.map(w => `${x(w.date).toFixed(1)},${y(w.kg).toFixed(1)}`).join(" ");
  const ticks = [lo, (lo + hi) / 2, hi];
  return `<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Evolución del peso">
    ${ticks.map(v => `<line x1="${P.l}" x2="${W - P.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${P.l - 6}" y="${y(v) + 4}" text-anchor="end">${fmt1(v)}</text>`).join("")}
    <polyline points="${pts}" fill="none" stroke="var(--lime)" stroke-width="2.5" stroke-linejoin="round"/>
    ${ws.map(w => `<circle cx="${x(w.date)}" cy="${y(w.kg)}" r="3.5" fill="var(--lime)"/>`).join("")}
    <text x="${P.l}" y="${H - 5}">${ws[0].date}</text><text x="${W - P.r}" y="${H - 5}" text-anchor="end">${ws[ws.length - 1].date}</text></svg></div>`;
}

async function analyzePhoto(answering) {
  const st = sheetState, ph = st.photo; readPhotoFields();
  const net = (ph.grams || 0) - (ph.plate || 0); if (!ph.blob) return;
  if (net <= 0) { st.error = ph.grams ? "El plato vacío no puede pesar más que el total." : "Escribe lo que pesa la comida en la báscula."; renderSheet(); return; }
  let user = `Peso total de la comida (sin el plato): ${fmt0(net)} g.` + (ph.note ? `\nComentario del usuario: ${ph.note}` : "");
  if (answering && ph.analysis) {
    const ans = [...document.querySelectorAll("[data-pq]")].map(n => [ph.analysis.questions[Number(n.dataset.pq)], n.value.trim()]).filter(x => x[1]);
    if (!ans.length) return;
    user += `\nTu análisis anterior: ${JSON.stringify(ph.analysis)}\nMis respuestas:\n` + ans.map(([q, a]) => `- ${q}\n  Respuesta: ${a}`).join("\n") + "\nRecalcula el plato con esta información.";
  }
  st.busy = "photo"; st.error = null; renderSheet();
  try {
    const r = await askClaudeImage(user, ph.blob);
    let items = (r.items || []).filter(it => it.grams > 0 && it.grams <= 3000 && it.kcal_per_100g >= 0 && it.kcal_per_100g <= 900);
    const sum = items.reduce((a, it) => a + it.grams, 0);
    if (sum > 0 && Math.abs(sum - net) >= 1) items = items.map(it => ({ ...it, grams: Math.round(it.grams * net / sum) }));
    ph.analysis = { items, questions: (r.questions || []).slice(0, 3), note: r.note || "" }; ph.removed = [];
  } catch (e) { st.error = claudeError(e); }
  st.busy = null; if (sheetState === st) renderSheet();
}

async function askVision(prompt, schema, user, blob, effort) {
  if (sample) return sample.json(prompt + "\n\n" + user, blob ? { images: blob, modelTier: "default" } : { modelTier: "default" });
  const key = claudeKey();
  if (!key) throw new Error("Añade tu clave de la API de Claude en Perfil, o abre la demo desde su enlace de claude.ai.");
  if (!anthropicClient) { const mod = await import("https://cdn.jsdelivr.net/npm/@anthropic-ai/sdk@0.131.0/+esm"); anthropicClient = new (mod.default || mod.Anthropic)({ apiKey: key, dangerouslyAllowBrowser: true }); }
  const content = [{ type: "text", text: user }];
  if (blob) { const data = await new Promise((ok, ko) => { const fr = new FileReader(); fr.onload = () => ok(String(fr.result).split(",")[1]); fr.onerror = ko; fr.readAsDataURL(blob); }); content.unshift({ type: "image", source: { type: "base64", media_type: "image/jpeg", data } }); }
  const msg = await anthropicClient.beta.messages.create({ model: "claude-opus-5-5", max_tokens: 16000, betas: ["server-side-fallback-2026-07-01"], fallbacks: "default", system: prompt,
    output_config: { effort, format: { type: "json_schema", schema } }, messages: [{ role: "user", content }] });
  if (msg.stop_reason === "refusal") throw new Error("Claude no ha podido responder a esta petición.");
  if (msg.stop_reason === "max_tokens") throw new Error("La respuesta llegó incompleta. Inténtalo de nuevo.");
  return JSON.parse((msg.content.filter(b => b.type === "text").pop() || {}).text);
}

      const r = await askVision(CALC_PROMPT, SCHEMA_ESTIMATE, user, st.blob || null, "low"), got = r.items || [];
      const items = rows.map((x, i) => { const m = got.length === rows.length ? got[i] : got.find(g => String(g.name).toLowerCase() === x.name.trim().toLowerCase());
        return m && m.kcal_per_100g >= 0 && m.kcal_per_100g <= 900 ? { ...m, name: x.name.trim(), grams: x.grams } : null; }).filter(Boolean);
      st.result = { items, note: r.note || "" }; if (!items.length) st.error = "Claude no ha devuelto valores válidos. Revisa los nombres."; }
    catch (e) { st.error = claudeError(e); }
    st.busy = null; if (sheetState === st) renderSheet(); },
  logSave() { const st = sheetState, d = dayData(ui.day); d.log[st.type] = (d.log[st.type] || []).concat(st.result.items.map(it => ({ name: it.name, grams: it.grams, per100: { kcal: it.kcal_per_100g, protein: it.protein_per_100g, carbs: it.carbs_per_100g, fat: it.fat_per_100g } })));
    d.done[st.type] = true; save(); closeSheet(); toast("Añadido a " + MEALS.find(m => m[0] === st.type)[1].toLowerCase()); },
  async pAnalyze() { await analyzePhoto(false); },
  async pAnswer() { await analyzePhoto(true); },
  pToggle(i) { const ph = sheetState.photo, n = Number(i); ph.removed = ph.removed || []; ph.removed = ph.removed.includes(n) ? ph.removed.filter(x => x !== n) : [...ph.removed, n]; renderSheet(); },
  pAdd() { const st = sheetState, ph = st.photo; ph.analysis.items.forEach((it, i) => { if ((ph.removed || []).includes(i)) return;
      st.items.push({ name: it.name, grams: it.grams, per100: { kcal: it.kcal_per_100g, protein: it.protein_per_100g, carbs: it.carbs_per_100g, fat: it.fat_per_100g }, source: "claude" }); });
    st.photo = {}; renderSheet(); },
  cDel(i) { sheetState.items.splice(Number(i), 1); renderSheet(); },
  cPick(k) { sheetState.pick = k; renderSheet(); },
  cAddFood() { const g = num(document.getElementById("cGrams").value); if (!g || g <= 0) return; const f = FOODS[sheetState.pick];
    sheetState.items.push({ name: f.name, grams: g, per100: foodV(f.key), source: "catálogo" }); sheetState.pick = null; renderSheet(); },
  cAddManual() { const name = document.getElementById("mName").value.trim(), g = num(document.getElementById("mGrams").value), k = num(document.getElementById("mKcal").value);
    if (!name || !g || g <= 0 || k === null) { sheetState.error = "Pon nombre, gramos y kcal totales."; renderSheet(); return; }
    const f = 100 / g, val = id => (num(document.getElementById(id).value) || 0) * f;
    sheetState.items.push({ name, grams: g, per100: { kcal: k * f, protein: val("mP"), carbs: val("mC"), fat: val("mF") }, source: "manual" }); sheetState.error = null; renderSheet(); },
  async cEstimate() { const st = sheetState, desc = document.getElementById("cDesc").value.trim(); st.desc = desc; if (!desc) return;
    st.busy = "estimate"; st.error = null; renderSheet();
    try { const r = await askClaude(ESTIMATE_PROMPT, desc, SCHEMA_ESTIMATE, "low");
      const items = (r.items || []).filter(it => it.grams > 0 && it.grams <= 3000 && it.kcal_per_100g >= 0 && it.kcal_per_100g <= 900);
      st.estimate = { items, note: r.note || "" }; if (!items.length) st.error = "Claude no devolvió ingredientes válidos."; }
    catch (e) { st.error = claudeError(e); }
    st.busy = null; if (sheetState === st) renderSheet(); },
  cAddEstimate() { const st = sheetState; st.estimate.items.forEach(it => st.items.push({ name: it.name, grams: it.grams, per100: { kcal: it.kcal_per_100g, protein: it.protein_per_100g, carbs: it.carbs_per_100g, fat: it.fat_per_100g }, source: "claude" }));
    st.estimate = null; st.desc = ""; renderSheet(); },
  async cSuggest() { const st = sheetState, label = MEALS.find(m => m[0] === st.type)[1];
    const cat = CATALOG.foods.map(f => `${f.key} | ${f.name} | ${BASIS[f.basis]} | ${fmt0(f.kcal)} kcal, P ${f.protein}, C ${f.carbs}, G ${f.fat}`).join("\n");
    const ctx = st.items.length ? "Había apuntado: " + st.items.map(i => fmt0(i.grams) + " g de " + i.name).join(", ") + ". Quiere una opción más saludable." : (st.desc ? "Quiere algo parecido a: " + st.desc : "");
    const user = `Comida: ${label}\nObjetivo: ${fmt0(st.target.kcal)} kcal, proteínas ${fmt0(st.target.protein)} g, carbohidratos ${fmt0(st.target.carbs)} g, grasas ${fmt0(st.target.fat)} g.\n${ctx}\nCatálogo (id | nombre | cómo se pesa | por 100 g):\n${cat}`;
    st.busy = "suggest"; st.error = null; renderSheet();
    try { const r = await askClaude(SUGGEST_PROMPT, user, SCHEMA_SUGGEST, "medium");
      st.suggestions = (r.meals || []).map(m => ({ name: m.name, why: m.why, lines: (m.items || []).filter(i => FOODS[i.food_id] && i.grams > 0 && i.grams <= 1500).map(i => ({ food: i.food_id, grams: Math.round(i.grams) })) })).filter(m => m.lines.length);
      if (!st.suggestions.length) st.error = "Claude no devolvió comidas válidas con el catálogo."; }
    catch (e) { st.error = claudeError(e); }
    st.busy = null; if (sheetState === st) renderSheet(); },
  cUse(i) { const st = sheetState, m = st.suggestions[Number(i)]; st.items = m.lines.map(l => ({ name: FOODS[l.food].name, grams: l.grams, per100: foodV(l.food), source: "catálogo" })); st.suggestions = []; renderSheet(); },
  cSave() { const st = sheetState;
    if (st.fromBuilder) { const b = st.fromBuilder;
      if (st.items.length) { b.picks[st.type] = { kind: "custom", items: st.items }; b.values[st.type] = st.items.reduce((a, it) => add(a, per(it.per100, it.grams)), V0()); b.step++; b.all = false; }
      openSheet(b); return; }
    if (st.items.length) setMeal(ui.day, st.type, { kind: "custom", items: st.items }); else { const d = dayData(ui.day); if (d.meals[st.type] && d.meals[st.type].kind === "custom") delete d.meals[st.type]; }
    save(); closeSheet(); toast("Comida guardada"); },
  viewPhoto(k) { const ph = PHOTOS[k]; if (!ph) return; const o = document.createElement("div"); o.className = "photo-full"; o.innerHTML = `<img src="${ph.src}" alt="Foto de progreso">`; o.onclick = () => o.remove(); document.body.appendChild(o); },
  async delPhoto(k) { if (!confirm("¿Eliminar esta foto?")) return; try { await photoTx("readwrite", st => st.delete(k)); } catch (e) {} delete PHOTOS[k]; render(); },
  closeSheet() { if (sheetState && sheetState.fromBuilder) { openSheet(sheetState.fromBuilder); return; } closeSheet(); },
  sheetBg() {},
  openSession(v) { tab = "gym"; ui.session = v; ui.editRoutine = false; render(); window.scrollTo(0, 0); },
  closeSession() { ui.session = null; ui.editRoutine = false; render(); },
  sessionDone(sid) { const L = weekLogEnsure(sid); L.done = !L.done; save(); render(); },
  exDone(i) { const sid = ui.session, ex = exercisesOf(sid)[Number(i)], e = exLog(weekLogEnsure(sid), ex); e.done = !e.done; save(); render(); },
  setDone(v) { const [i, j] = v.split(":").map(Number), sid = ui.session, e = exLog(weekLogEnsure(sid), exercisesOf(sid)[i]); e.sets[j].done = !e.sets[j].done; save(); render(); },
  editRoutine() { ui.editRoutine = !ui.editRoutine; render(); },
  exUp(i) { const l = exercisesOf(ui.session), n = Number(i); [l[n - 1], l[n]] = [l[n], l[n - 1]]; save(); render(); },
  exDown(i) { const l = exercisesOf(ui.session), n = Number(i); [l[n + 1], l[n]] = [l[n], l[n + 1]]; save(); render(); },
  exDel(i) { exercisesOf(ui.session).splice(Number(i), 1); save(); render(); },
  exAdd() { exercisesOf(ui.session).push({ id: "custom-" + Date.now(), name: "Nuevo ejercicio", sets: 3, lo: 8, hi: 12 }); save(); render(); },
  exRestore() { delete S.routine[ui.session]; save(); render(); toast("Rutina restaurada"); },
  addWeight() { const kg = num(document.getElementById("wKg").value), dk = document.getElementById("wDate").value, waist = num(document.getElementById("wWaist").value);
    if (!kg || kg < 20 || kg > 400 || !dk) { toast("Introduce un peso válido"); return; } addWeight(dk, kg, waist); save(); render(); toast("Pesaje guardado"); },
  delWeight(v) { const [d, kg] = v.split("|"); const i = S.weights.findIndex(w => w.date === d && String(w.kg) === kg); if (i >= 0) S.weights.splice(i, 1); recalc(); save(); render(); },
  goal(v) { S.profile.goal = v; save(); render(); },
  saveProfile() { const p = S.profile, w = num(document.getElementById("pWeight").value);
    p.heightCm = num(document.getElementById("pHeight").value); p.age = num(document.getElementById("pAge").value); p.sex = document.getElementById("pSex").value || null;
    p.activity = document.getElementById("pAct").value; p.auto = document.getElementById("pAuto").checked;
    if (w && Math.abs(w - (latestWeight() || 0)) >= 0.05) addWeight(dayKey(new Date()), w); const e = recalc(); save(); render();
    toast(e && p.auto ? `Objetivos: ${e.kcal} kcal · P ${e.protein} · C ${e.carbs} · G ${e.fat}` : "Perfil guardado"); },
  saveTargets() { const T = S.targets; T.kcal = num(document.getElementById("tK").value) || T.kcal; T.protein = num(document.getElementById("tP").value) || T.protein;
    T.carbs = num(document.getElementById("tC").value) || T.carbs; T.fat = num(document.getElementById("tF").value) || T.fat; S.profile.auto = false; save(); render(); toast("Objetivos guardados"); },
  saveKey() { const k = document.getElementById("cKey").value.trim(); if (!k) return; try { localStorage.setItem(KEY_STORE, k); } catch (e) { toast("Este navegador no permite guardar la clave"); return; } anthropicClient = null; render(); toast("Clave guardada en este navegador"); },
  delKey() { try { localStorage.removeItem(KEY_STORE); } catch (e) { /* nada */ } anthropicClient = null; render(); },
  async export() { const text = JSON.stringify(S, null, 1), name = "now-or-never-copia-" + dayKey(new Date()) + ".json";
    if (downloads) { try { await downloads.save({ filename: name, data: text }); toast("Copia descargada"); } catch (e) { if (e.code !== "declined") toast("No se pudo descargar la copia"); } return; }
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type: "application/json" })); a.download = name; a.click(); },
};
function onEdit(t) {
  const act = t.dataset.act, v = t.dataset.v;
  if (!act) return;
  const sid = ui.session;
  if (act === "setKg" || act === "setReps") { const [i, j] = v.split(":").map(Number), e = exLog(weekLogEnsure(sid), exercisesOf(sid)[i]); e.sets[j][act === "setKg" ? "kg" : "reps"] = num(t.value); save(); }
  if (act === "exName") { exercisesOf(sid)[Number(v)].name = t.value.trim() || "Ejercicio"; save(); }
  if (act === "exSets") { const n = Math.round(num(t.value)); if (n >= 1 && n <= 10) { exercisesOf(sid)[Number(v)].sets = n; save(); } }
  if (act === "exLo" || act === "exHi") { const n = Math.round(num(t.value)), ex = exercisesOf(sid)[Number(v)]; if (n >= 1 && n <= 100) { ex[act === "exLo" ? "lo" : "hi"] = n; if (ex.hi < ex.lo) ex.hi = ex.lo; save(); } }
}
document.addEventListener("click", e => {
  const t = e.target.closest("[data-act]");
  if (!t || t.tagName === "INPUT" || t.tagName === "TEXTAREA") return;
  if (t.dataset.act === "sheetBg" && e.target !== t) return;
  if (t.dataset.act === "sheetBg") { actions.closeSheet(); return; }
  const fn = actions[t.dataset.act]; if (fn) fn(t.dataset.v);
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset && t.dataset.logphoto && t.files[0]) { const f = t.files[0]; t.value = ""; openLog(t.dataset.logphoto, f); return; }
  if (t.dataset && t.dataset.logfile && t.files[0]) { const f = t.files[0]; t.value = ""; setLogPhoto(f); return; }
  if (t.dataset && t.dataset.lrow !== undefined) { const st = sheetState, r = st.rows[Number(t.dataset.lrow)]; if (t.dataset.f === "grams") r.grams = num(t.value); else r.name = t.value;
    // Sin volver a pintar (no se pierde el foco al pasar al siguiente campo), salvo para quitar un resultado ya calculado.
    if (st.result) { st.result = null; renderSheet(); return; }
    const valid = st.rows.filter(x => x.name.trim()), btn = document.querySelector('[data-act="logCalc"]');
    if (btn) btn.disabled = !(claudeMode() && valid.length && valid.every(x => x.grams > 0) && !st.busy); return; }
  if (t.id === "pFile" && t.files[0]) { const f = t.files[0]; readPhotoFields(); photoBlob(f).then(b => { const ph = sheetState.photo = sheetState.photo || {}; if (ph.url) URL.revokeObjectURL(ph.url); ph.blob = b; ph.url = URL.createObjectURL(b); ph.analysis = null; renderSheet(); }).catch(() => toast("No se pudo leer la foto")); return; }
  if (["pGrams", "pPlate", "pNote"].includes(t.id)) { readPhotoFields(); return; }
  if (t.dataset && t.dataset.photo && t.files[0]) { savePhoto(t.dataset.photo, t.files[0]); t.value = ""; return; }
  if (t.id === "dayPick" && t.value) { ui.day = t.value; render(); return; }
  if (t.id === "importFile" && t.files[0]) { const r = new FileReader(); r.onload = () => { try { const x = JSON.parse(r.result); if (!x || !x.targets || !x.days) throw 0; S = normalize(x); save(); render(); toast("Copia importada"); } catch (err) { toast("Ese archivo no es una copia de Now or Never"); } }; r.readAsText(t.files[0]); return; }
  onEdit(t);
});
document.addEventListener("input", e => {
  if (e.target.id === "tK") { const k = num(e.target.value); if (k >= 800 && k <= 6000) { const m = macrosForKcal(k); [["tP", m.protein], ["tC", m.carbs], ["tF", m.fat]].forEach(([id, v]) => { const n = document.getElementById(id); if (n) n.value = v; }); } return; }
  if (e.target.id === "cSearch") { sheetState.q = e.target.value; const pos = e.target.selectionStart; renderSheet(); const n = document.getElementById("cSearch"); n.focus(); n.setSelectionRange(pos, pos); } });

/* ===== Arranque ===== */
S = normalize(readLocal());
render();
(function splash() {
  if (!QUOTES.length) return;
  let last = -1; try { last = Number(localStorage.getItem("now-or-never-quote") ?? -1); } catch (e) {}
  let i = Math.floor(Math.random() * QUOTES.length); if (i === last) i = (i + 1) % QUOTES.length;
  try { localStorage.setItem("now-or-never-quote", String(i)); } catch (e) {}
  const q = QUOTES[i], el = document.createElement("div");
  el.className = "splash"; el.setAttribute("role", "dialog"); el.setAttribute("aria-label", "Frase del día");
  el.innerHTML = `<div class="eyebrow">Now or Never</div><i></i><p>${esc(q.text)}</p>${q.author ? `<span>— ${esc(q.author)}</span>` : ""}<small>Toca para empezar</small>`;
  const close = () => { el.classList.add("out"); setTimeout(() => el.remove(), 350); };
  el.onclick = close; setTimeout(close, 3000); document.body.appendChild(el);
})();
loadPhotos().then(() => { if (tab === "progress" && !sheetState) render(); });
(async function connect() {
  if (!window.claude || !window.claude.use) return;
  const [dbNs, userNs, sampleNs, dlNs] = await Promise.all(["db", "user", "sample", "downloads"].map(n => window.claude.use(n).catch(() => null)));
  sample = sampleNs; downloads = dlNs;
  const id = userNs ? await userNs.id().catch(() => null) : null;
  if (dbNs && id) {
    db = dbNs; docRef = db.doc("data/users/" + id + "/state");
    try {
      const snap = await docRef.get(), remote = snap.exists ? snap.data() : null;
      if (remote && (remote.updatedAt || 0) > (S.updatedAt || 0)) { S = normalize(JSON.parse(JSON.stringify(remote))); writeLocal(); cloudStatus = "Guardado en tu cuenta de Claude"; }
      else if (S.updatedAt) { await pushCloud(); }
      else cloudStatus = "Se guardará en tu cuenta de Claude";
    } catch (e) { cloudStatus = "Guardado en este navegador (la nube no responde)"; docRef = null; }
  }
  if (!sheetState) render();
})();
</script>
