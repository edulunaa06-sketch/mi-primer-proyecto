name: Compilar Now or Never (.ipa)

on:
  push:
    paths:
      - 'NowOrNever/**'
      - '.github/workflows/ios-ipa.yml'
  workflow_dispatch:

jobs:
  build:
    name: Compilar sin firmar y empaquetar
    # macOS 15 trae Xcode 16, que es el formato de proyecto que escribe XcodeGen.
    runs-on: macos-15

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Ver versión de Xcode
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios || true

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar el proyecto de Xcode
        working-directory: NowOrNever
        run: xcodegen generate --spec project.yml

      - name: Compilar en Release (sin firmar)
        working-directory: NowOrNever
        run: |
          set -o pipefail
          xcodebuild \
            -project NowOrNever.xcodeproj \
            -scheme NowOrNever \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Empaquetar como NowOrNever.ipa
        working-directory: NowOrNever
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/NowOrNever.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "No se ha encontrado la app compilada en $APP_PATH"
            exit 1
          fi
          rm -rf Payload NowOrNever.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry NowOrNever.ipa Payload
          unzip -l NowOrNever.ipa | head -20
          ls -lh NowOrNever.ipa

      - name: Subir el .ipa como artifact
        uses: actions/upload-artifact@v4
        with:
          name: NowOrNever-ipa
          path: NowOrNever/NowOrNever.ipa
          if-no-files-found: error
          retention-days: 30

  capturas:
    name: Capturas en el simulador
    runs-on: macos-15

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar el proyecto de Xcode
        working-directory: NowOrNever
        run: xcodegen generate --spec project.yml

      - name: Compilar para el simulador
        working-directory: NowOrNever
        run: |
          set -o pipefail
          xcodebuild \
            -project NowOrNever.xcodeproj \
            -scheme NowOrNever \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-sim \
            build

      - name: Arrancar la app y hacer capturas
        working-directory: NowOrNever
        run: |
          set -euo pipefail
          APP="build-sim/Build/Products/Debug-iphonesimulator/NowOrNever.app"
          BUNDLE="com.nowornever.app"

          LISTA=$(xcrun simctl list devices available | grep -E '^[[:space:]]+iPhone' || true)
          if [ -z "$LISTA" ]; then
            echo "No hay ningún iPhone disponible en el simulador"
            exit 1
          fi
          LINEA=$(echo "$LISTA" | grep -m1 'iPhone 16 Pro' || echo "$LISTA" | grep -m1 'iPhone 16' || echo "$LISTA" | head -1)
          UDID=$(echo "$LINEA" | grep -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}' | head -1)
          echo "Simulador elegido: $LINEA"

          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
          xcrun simctl install "$UDID" "$APP"

          mkdir -p capturas
          captura() {
            nombre="$1"
            shift
            xcrun simctl terminate "$UDID" "$BUNDLE" >/dev/null 2>&1 || true
            xcrun simctl launch "$UDID" "$BUNDLE" "$@"
            sleep 6
            xcrun simctl io "$UDID" screenshot "capturas/$nombre.png"
          }

          captura 01-bienvenida -onboarding
          captura 02-inicio -demo -tab 0
          captura 03-nutricion -demo -tab 1
          captura 04-entreno -demo -tab 2
          captura 05-entreno-push -demo -tab 2 -workout
          captura 06-progreso -demo -tab 3
          captura 07-perfil -demo -tab 4

          ls -lh capturas

      - name: Subir las capturas
        uses: actions/upload-artifact@v4
        with:
          name: NowOrNever-capturas
          path: NowOrNever/capturas/*.png
          if-no-files-found: error
          retention-days: 30
